# Tests every push; builds Deep Cuts for Linux (AppImage + .deb) and Windows (NSIS installer +
# portable .exe) on GitHub's runners for version tags and manual runs. Push the repo to GitHub, open the Actions
# tab, and download the artifacts — no Windows machine needed.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
jobs:
  # Phase 8 (Kimi T1): a ~2-minute test job runs on every push and PR; the
  # 40-minute Rust builds only run for version tags and manual dispatch, and
  # only after tests pass. Saves CI minutes and gives regression coverage for
  # the SQL pipeline (Python fixtures), the TS layer (tsc + vitest) and the
  # query layer end-to-end (smoke scripts against dev-server + the demo seed).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb pytz
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm test
      - name: SQL fixture tests
        run: python3 scripts/test_sql_fixtures.py
      - name: Query smoke tests against the demo record
        run: |
          python3 scripts/seed_dev_db.py
          OLLAMA_MOCK=1 DEEPCUTS_TZ=America/Detroit node dev-server.mjs & sleep 6
          npx tsx scripts/smoke-queries.ts
          npx tsx scripts/smoke-insights.ts
          npx tsx scripts/smoke-recs.ts
          npx tsx scripts/smoke-wild.ts
          npx tsx scripts/smoke-eras.ts
          npx tsx scripts/smoke-crate.ts
          npx tsx scripts/smoke-metrics.ts
          npx tsx scripts/smoke-awards.ts
          OLLAMA_MOCK=1 npx tsx scripts/smoke-ask.ts

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p out && cp src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb out/
          touch out/portable.flag
      - name: Collect Windows packages (installer + portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe out\
          New-Item -ItemType Directory -Force out\DeepCuts-portable | Out-Null
          Copy-Item src-tauri\target\release\deep-cuts.exe out\DeepCuts-portable\DeepCuts.exe
          New-Item -ItemType File -Force out\DeepCuts-portable\portable.flag | Out-Null
          Compress-Archive -Path out\DeepCuts-portable\* -DestinationPath out\DeepCuts-portable-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: deep-cuts-${{ runner.os }}
          path: out/*

  # Tag a version (e.g. `git tag v3.0.0 && git push --tags`) and a GitHub Release is created
  # with every installer and the portable zip attached.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
